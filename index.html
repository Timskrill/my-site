<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя визитка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Привет, я Иван</h1>
        <img src="https://via.placeholder.com/150" alt="Моё фото" class="avatar">
    </header>

    <main>
        <section class="about">
            <h2>Обо мне</h2>
            <p>Я веб-разработчик. Учусь настраивать CI/CD через GitHub Actions.</p>
        </section>

        <section class="counter-block">
            <h2>Счётчик кликов</h2>
            <p>Нажато: <span id="counter">0</span> раз</p>
            <button id="clickBtn">Нажми меня</button>
        </section>

        <section class="theme-block">
            <button id="themeBtn">Переключить тему</button>
        </section>
    </main>

    <footer>
        <p>2026 Мой сайт</p>
    </footer>

    <script src="script.js"></script>
    <div>   
</body>
